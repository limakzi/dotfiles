onboarding = false

[terminal]
default_shell = "zsh"


[theme]
name = "terminal"


[ui]
pane_gaps = true

confirm_close                     = true
prompt_new_tab_name               = false
show_agent_labels_on_pane_borders = true

status_indicators            = "symbols"
sidebar_width                = 64
sidebar_min_width            = 48
sidebar_max_width            = 64
sidebar_collapsed_mode       = "hidden"
hide_tab_bar_when_single_tab = false

tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
  { type = "text", text = "prod" },
  { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]


[remote]
manage_ssh_config = true


[worktrees]
directory = "~/cache/herdr/worktrees"


[experimental]
allow_nested = true
pane_history = true


[keys]
prefix = "ctrl+a"
goto = "prefix+ctrl+p"

split_vertical   = "prefix+|"
split_horizontal = "prefix+-"
new_tab          = ["prefix+c", "prefix+ctrl+n"]
close_workspace  = "prefix+shift+q"
switch_tab       = "alt+1..9"
reload_config    = "prefix+r"
resize_mode      = "prefix+shift+r"
zoom             = "prefix+enter"

[[keys.command]]
key         = "prefix+t"
type        = "popup"
command     = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width       = "80%"
height      = "80%"
