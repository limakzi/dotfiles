onboarding = false

[terminal]
default_shell = "zsh"
new_cwd       = "follow"
kitty_graphics = true


[theme]
## herdr has no theme files; a built-in base is required. Every token below
## is overridden, so the base contributes nothing — this is bruxa
## (mirrors ghostty/themes/bruxa).
name = "dracula"

[theme.custom]
## Surfaces, darkest → lightest.
panel_bg      = "#22212c"
sidebar_bg    = "#22212c"
surface_dim   = "#1b1a23"
surface0      = "#2f2d3d"
surface1      = "#454158"
active_row_bg = "#454158"
selection_bg  = "#5a5577"

## Text, brightest → dimmest.
text          = "#f8f8f2"
subtext0      = "#bfbfb8"
overlay1      = "#bfbfb8"
overlay0      = "#7970a9"

## Accents.
accent        = "#9580ff"
blue          = "#9580ff"
mauve         = "#ff80bf"
green         = "#8aff80"
yellow        = "#ffff80"
red           = "#ff9580"
teal          = "#80ffea"
peach         = "#ffaa99"


[ui]
pane_gaps = false

confirm_close                     = true
prompt_new_tab_name               = false
show_agent_labels_on_pane_borders = true

status_indicators            = "symbols"
sidebar_width                = 64
sidebar_min_width            = 48
sidebar_max_width            = 64
sidebar_collapsed_mode       = "hidden"
agent_panel_sort             = "priority"
hide_tab_bar_when_single_tab = false

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "case $(uname -s) in Darwin) i=\"\uf179\" ;; *) [ -f /etc/debian_version ] && i=\"\uf306\" || i=\"\uf17c\" ;; esac; echo \"$i $(hostname -s)\"", interval_seconds = 3600 },
  { type = "command", command = "echo \"\U000f00ed $(LC_ALL=C date '+%a %d %b')\"", interval_seconds = 60 },
  { type = "datetime", format = "\U000f0954 %H:%M" },
  { type = "command", command = "[ \"$(uname -s)\" = Darwin ] && echo \"\uf511 $($HOME/.local/bin/1p)\"", interval_seconds = 5 },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace", "tab", "agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
]


[session]
## Relaunch Claude (and other integrated agents) into their own conversation
## after a server restart. Needs `herdr integration install claude`, whose
## SessionStart hook reports the session id — tracked in dot-claude.
resume_agents_on_restore   = true
startup_per_agent_delay_ms = 250


[remote]
manage_ssh_config = true


[worktrees]
directory = "~/cache/herdr/worktrees"


[experimental]
allow_nested = false
pane_history = true


[keys]
prefix = "ctrl+a"
goto = "prefix+ctrl+p"

split_vertical   = "prefix+|"
split_horizontal = "prefix+ctrl+-"
new_tab          = []
new_workspace    = "prefix+shift+n"
new_worktree     = "prefix+ctrl+n"
close_workspace  = "prefix+shift+q"
switch_tab       = "alt+1..9"
next_agent       = "ctrl+]"
previous_agent   = "ctrl+["
reload_config    = "prefix+r"
resize_mode      = "prefix+shift+r"
zoom             = "prefix+enter"
toggle_sidebar   = "prefix+ctrl+/"

[[keys.command]]
key         = "prefix+t"
type        = "popup"
command     = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width       = "80%"
height      = "80%"
