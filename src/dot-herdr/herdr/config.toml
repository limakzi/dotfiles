onboarding = false

[terminal]
default_shell = "zsh"
new_cwd       = "home"


[theme]
name = "dracula"

## limakzi — mirrors ghostty/themes/limakzi (Dracula Pro palette).
[theme.custom]
accent        = "#9580ff"
panel_bg      = "#22212c"
active_row_bg = "#454158"
selection_bg  = "#454158"
surface0      = "#454158"
overlay0      = "#7970a9"
overlay1      = "#bfbfb8"
text          = "#f8f8f2"
mauve         = "#ff80bf"
green         = "#8aff80"
yellow        = "#ffff80"
red           = "#ff9580"
blue          = "#9580ff"
teal          = "#80ffea"
peach         = "#ffaa99"


[ui]
pane_gaps = true

confirm_close                     = true
prompt_new_tab_name               = false
show_agent_labels_on_pane_borders = true

status_indicators            = "symbols"
sidebar_width                = 64
sidebar_min_width            = 48
sidebar_max_width            = 64
sidebar_collapsed_mode       = "hidden"
hide_tab_bar_when_single_tab = false

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "echo \"\uf179 $(hostname -s)\"", interval_seconds = 3600 },
  { type = "command", command = "echo \"\U000f00ed $(LC_ALL=C date '+%a %d %b')\"", interval_seconds = 60 },
  { type = "datetime", format = "\U000f0954 %H:%M" },
  { type = "command", command = "echo \"\uf511 $($HOME/.local/bin/1p)\"", interval_seconds = 5 },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace", "tab", "agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
]


[remote]
manage_ssh_config = true


[worktrees]
directory = "~/cache/herdr/worktrees"


[experimental]
allow_nested = false
pane_history = true


[keys]
prefix = "ctrl+a"
goto = "prefix+ctrl+p"

split_vertical   = "prefix+|"
split_horizontal = "prefix+-"
new_tab          = ["prefix+c", "prefix+ctrl+n"]
new_worktree     = "prefix+n"
close_workspace  = "prefix+shift+q"
switch_tab       = "alt+1..9"
reload_config    = "prefix+r"
resize_mode      = "prefix+shift+r"
zoom             = "prefix+enter"

[[keys.command]]
key         = "prefix+t"
type        = "popup"
command     = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width       = "80%"
height      = "80%"
