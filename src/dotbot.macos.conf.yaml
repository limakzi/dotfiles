---

- defaults:
    link:
      create: true
      relink: true
    create:
      mode: 0700

- link:
    ~/.Brewfile: ./dot-brew/brew/Brewfile
    ~/.hushlogin: ./dot-hushlogin/hushlogin/hushlogin
    ~/.zshenv: ./dot-zsh/zshenv
    ~/.config/bash: ./dot-bash/bash/
    ~/.config/ghostty: ./dot-ghostty/ghostty/
    ~/.config/git: ./dot-git/git/
    ~/.config/herdr: ./dot-herdr/herdr/
    ~/.config/lsd: ./dot-lsd/lsd/
    ~/.config/nvim: ./dot-nvim/nvim/
    ~/.config/starship: ./dot-starship/starship/
    ~/.config/zsh: ./dot-zsh/zsh/

- link:
    ~/.local/bin/1p: ./dot-1password/1p
    ~/.config/1password: ./dot-1password/1password/
